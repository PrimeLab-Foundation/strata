[build-system]
requires = [
  "setuptools>=64",
  "wheel",
  "cmake>=3.20",
  "pytest>=7",
]
build-backend = "setuptools.build_meta"

[project]
name = "strata"
version = "0.2.0"
description = "Fast C++ JSON parser with Python C API bindings (no pybind11)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Strata Authors" }]
keywords = ["json", "jsonpath", "parser", "ndjson", "strata"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4.0",  # For coverage (Rule 14)
  "mypy>=1.8",
  "ruff>=0.5",
  "pre-commit>=3.5",
  "psutil>=5",
]
bench = [
  "orjson",
  "ujson",
  "pysimdjson; platform_system != 'Windows' and  python_version < '3.14'",
  "ijson",
  "msgspec",
  "jmespath",
  "jsonpath-ng",
  "plotly",
  "pandas",
  "psutil",
]

[project.urls]
Homepage = "https://github.com/example/strata"
Repository = "https://github.com/example/strata"

[tool.setuptools.packages.find]
where = ["."]
include = ["strata*"]
exclude = ["cpp_bkp*"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "pp* *_i686 *musllinux*"
archs = ["auto"]
manylinux-x86_64-image = "manylinux_2_28"
test-command = "python -c 'import strata; print(strata.__version__)'"

[tool.uv]
index-url = "https://pypi.org/simple"
dev-dependencies = [
  "pytest",
  "mypy",
  "ruff",
  "pre-commit",
]

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
testpaths = [
  "tests/py",
  "tests/unit",
]
markers = [
  "stress: long-running or memory-heavy tests (exclude with -m 'not stress')",
]
