[build-system]
requires = [
  "setuptools>=77",
  "wheel",
  # The build gates run the C++ suite (cmake/ctest) and the Python suites
  # (pytest) — both must exist inside an isolated build environment.
  "cmake>=3.20",
  "pytest>=7",
]
build-backend = "setuptools.build_meta"

[project]
name = "strata-plf"
dynamic = ["version"]
description = "Fast JSON for Python: parsing, serialization and JSONPath querying on a dependency-free C++20 engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Strata Authors" }]
keywords = ["json", "jsonpath", "parser", "ndjson", "strata"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: File Formats :: JSON",
  "Programming Language :: C++",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
dev = [
  # `make test` drives ctest, so the C++ suite must be runnable from a plain
  # `make dev` without a system CMake — and the same pinned binary then serves
  # both the local runs and the install gate.
  "cmake>=3.20",
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.5",
  "pre-commit>=3.5",
  # Pinned to the same major as the pre-commit clang-format hook so `make fmt`
  # and the hook cannot disagree about formatting.
  "clang-format>=21,<22",
]

bench = [
  # The competitor set from docs/context/benchmarks.md. pysimdjson has no
  # wheels for the newest CPython, so it is excluded there and the report says
  # so rather than silently comparing fewer libraries.
  "orjson",
  "msgspec",
  "ujson",
  "pysimdjson; platform_system != 'Windows' and python_version < '3.14'",
  "jmespath",
  "jsonpath-ng",
  "psutil>=5",
]

integrations = [
  # Third-party types for tests/integrations only: `make test-integrations`
  # and its own CI job. Kept out of testpaths, the gate and the PGO profile
  # (docs/architecture/dumps_default_hook.md, "Test placement", inherited by
  # docs/architecture/dumps_with_default.md).
  # 2.12.0: the oldest pydantic-core with CPython 3.14 wheels (2.11's does not
  # build there), and the pydantic adapter's floor.
  "pydantic>=2.12",
  "attrs>=22.2",
  "numpy>=1.26",
  # The framework adapters' floors (docs/architecture/framework_adapters.md):
  # the oldest release each adapter's suite passes on across CPython 3.10–3.14.
  "flask>=3.0.1",
  "django>=4.1",
  "aiohttp>=3.9",
  "falcon>=4.0",
  "fastapi>=0.100",
  # FastAPI's TestClient; 0.24–0.25.0 fail on 3.14, 0.28 drops what FastAPI
  # 0.100–0.110's TestClient passes (the floors leg holds 0.25.1).
  "httpx>=0.25.1",
  "structlog>=20.2",
  # The native-types differential (docs/architecture/native_types.md, rows 1-4
  # and 6); a comparison target here, never a dependency of strata itself.
  "orjson>=3.10",
  # Two walks interleaved on one thread by greenlet switches inside `default`:
  # the proof that `dumps_with_default`'s `native` mode is per call
  # (docs/decisions.md, 2026-09-29).
  "greenlet>=3.0",
]

release = [
  "build>=1.2",
  "twine>=6.1",
  "cibuildwheel==4.3.0",
]

[project.urls]
Homepage = "https://github.com/PrimeLab-Foundation/strata"
Repository = "https://github.com/PrimeLab-Foundation/strata"
Issues = "https://github.com/PrimeLab-Foundation/strata/issues"
Documentation = "https://github.com/PrimeLab-Foundation/strata/blob/main/docs/context/api.md"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
include = ["strata*"]

# Single source of truth for the version: the literal in
# python/strata/__init__.py (docs/context/api.md § Versioning).
[tool.setuptools.dynamic]
version = { attr = "strata.__version__" }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
  "tests/py",
  "tests/unit",
]
markers = [
  "stress: long-running or memory-heavy tests (exclude with -m 'not stress')",
]

# The framework adapters are measured by `make test-integrations`, which the
# gate's coverage run cannot include (docs/decisions.md, 2026-09-28).
[tool.coverage.run]
omit = ["*/strata/integrations/*"]

# Release wheels: before-build trains both PGO profiles into build/release-pgo
# (scripts/release.py profile); the wheel then builds through both test gates
# against them, and the test step proves the installed images' identities.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "cp3??t-* *-musllinux_* *_i686 *-win32"
build-frontend = "build"
before-build = "python {project}/scripts/release.py profile"
test-requires = ["pytest>=7"]
test-command = "python {project}/scripts/release.py check-install --identity"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
# perl-Digest-SHA: scripts/pgo_build.sh's hook phase hashes _strata with shasum.
before-all = "dnf install -y clang llvm lld perl-Digest-SHA"
environment-pass = ["CI"]

[tool.cibuildwheel.linux.environment]
CC = "/usr/bin/clang"
CXX = "/usr/bin/clang++"
CFLAGS = "--gcc-toolchain=$DEVTOOLSET_ROOTPATH/usr"
CXXFLAGS = "--gcc-toolchain=$DEVTOOLSET_ROOTPATH/usr"
LDFLAGS = "--gcc-toolchain=$DEVTOOLSET_ROOTPATH/usr -fuse-ld=lld"
PGO_MODE = "use"
STRATA_ENABLE_LTO = "1"
STRATA_PGO_PROFILE = "build/release-pgo/strata.profdata"
STRATA_HOOK_PGO_MODE = "use"
STRATA_HOOK_PGO_PROFILE = "build/release-pgo/hook.profdata"

[tool.cibuildwheel.macos.environment]
PGO_MODE = "use"
STRATA_ENABLE_LTO = "1"
STRATA_PGO_PROFILE = "build/release-pgo/strata.profdata"
STRATA_HOOK_PGO_MODE = "use"
STRATA_HOOK_PGO_PROFILE = "build/release-pgo/hook.profdata"

# clang-cl's LTO needs lld-link, which setuptools does not drive: no LTO here.
[tool.cibuildwheel.windows.environment]
STRATA_WIN_COMPILER = "clang-cl"
PGO_MODE = "use"
STRATA_PGO_PROFILE = "build/release-pgo/strata.profdata"
STRATA_HOOK_PGO_MODE = "use"
STRATA_HOOK_PGO_PROFILE = "build/release-pgo/hook.profdata"

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_x86_64"
inherit.environment = "append"
environment = { STRATA_MARCH = "x86-64-v3" }

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_aarch64"
inherit.environment = "append"
environment = { STRATA_MARCH = "armv8-a" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
inherit.environment = "append"
environment = { STRATA_MARCH = "x86-64-v3", MACOSX_DEPLOYMENT_TARGET = "13.0" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
inherit.environment = "append"
environment = { STRATA_MARCH = "none", MACOSX_DEPLOYMENT_TARGET = "11.0" }
