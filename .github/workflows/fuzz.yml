# Fuzzing (libFuzzer + ASan + UBSan)
# Runs on schedule and manual dispatch. Builds fuzz targets and runs them for a set duration.
# Crashes are captured as artifacts. See docs/development/fuzzing.md.

name: Fuzzing

on:
  schedule:
    - cron: "0 4 * * 2"   # Weekly Tuesday 04:00 UTC
  workflow_dispatch:

jobs:
  fuzz:
    name: libFuzzer (Ubuntu / clang)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-14 cmake

      - name: Run fuzz (build + run, Rule 16: Make → scripts/)
        env:
          FUZZ_TIME: 120
          FUZZ_ARTIFACT_PREFIX: fuzz_crashes/
          CXX: clang++
        run: make fuzz-run

      - name: Upload crash artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz_crashes/
