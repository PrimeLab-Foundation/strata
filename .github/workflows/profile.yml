name: Profile

# On this branch profile.yml IS a same-runner A/B on the Windows leg (E26-P6
# T4's Windows check): A = main 2ac7dbe, B = this ref (the P6+P7 source),
# both built by scripts/pgo_build_clang_cl.py on one runner, then
# benchmarks/ab_rows.py alternates the two extensions in one interpreter
# slot with orjson in-process as the control. Dispatched under profile.yml's
# name because the dispatch API resolves names on the default branch only.

on:
  workflow_dispatch:

jobs:
  ab-windows:
    name: A/B (windows-x86_64)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CPU facts
        shell: bash
        run: |
          mkdir -p ab
          { echo "platform windows-x86_64"; python -c "import platform; print(platform.processor(), platform.machine())"; } | tee ab/cpu.txt

      - name: Build B (candidate) with clang-cl PGO, gate tests on both phases
        shell: bash
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[dev,bench]"
          python scripts/pgo_build_clang_cl.py
          mkdir -p arms
          B=$(python -c 'import strata._strata as m; print(m.__file__)')
          cp "$B" arms/B.pyd
          echo "B $(git rev-parse --short HEAD) $(md5sum arms/B.pyd)" | tee -a ab/arms.txt

      - name: Build A (base) with the same recipe in a worktree
        shell: bash
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          git worktree add ../base 2ac7dbe
          cd ../base
          python -m venv .venv
          .venv/Scripts/python -m pip install -U pip setuptools wheel
          .venv/Scripts/python -m pip install -e ".[dev,bench]"
          PATH="$(pwd)/.venv/Scripts:$PATH" .venv/Scripts/python scripts/pgo_build_clang_cl.py
          A=$(.venv/Scripts/python -c 'import strata._strata as m; print(m.__file__)')
          cd "$GITHUB_WORKSPACE"
          cp "$A" arms/A.pyd
          echo "A $(git -C ../base rev-parse --short HEAD) $(md5sum arms/A.pyd)" | tee -a ab/arms.txt

      - name: Datasets (small and medium)
        shell: bash
        run: |
          PYTHONPATH=. python -m benchmarks.data.generate_bench_data --out-dir benchmarks/data/generated/small --num-users 1000 --max-orders 10 --max-items 5 --records 500
          PYTHONPATH=. python -m benchmarks.data.generate_bench_data --out-dir benchmarks/data/generated/medium --num-users 2000 --max-orders 20 --max-items 10 --records 2000

      - name: A-B-B-A rounds, then an A/A floor
        shell: bash
        run: |
          TARGET="$(python -c 'import strata._strata as m; print(m.__file__)')"
          ROWS="--row small:flat:dumps --row small:users:dumps --row small:mixed:dumps --row small:wide_arrays:dumps --row small:wide_arrays:loads --row small:mixed:loads --row medium:flat:dumps --row medium:users:dumps --row medium:mixed:dumps --row small:mixed:dump"
          PYTHONPATH=. python benchmarks/ab_rows.py --build A=arms/A.pyd --build B=arms/B.pyd --target "$TARGET" --out ab/R1.tsv $ROWS --blocks 6 --repeat 60 2> ab/R1.stderr || true
          PYTHONPATH=. python benchmarks/ab_rows.py --build A=arms/A.pyd --build B=arms/A.pyd --target "$TARGET" --out ab/AA.tsv $ROWS --blocks 6 --repeat 60 2> ab/AA.stderr || true
          PYTHONPATH=. python benchmarks/ab_blocks.py ab/R1.tsv --aa ab/AA.tsv --json ab/R1_analysis.json > ab/R1_blocks.txt 2>&1 || true
          cat ab/R1_blocks.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-windows-x86_64
          path: ab/
          if-no-files-found: ignore
