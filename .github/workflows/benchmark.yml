name: Benchmarks

# Weekly benchmark run plus the regression gate.
#
# Two defects from the previous implementation are deliberately not repeated:
# its dataset paths omitted the tier directory (so every run failed on a
# missing file), and its gate ran at --threshold 5 while the contract in
# docs/context/benchmarks.md is 2% on median/p95. The thresholds now live in
# benchmarks/regression_check.py, which also refuses a report containing
# ERROR rows rather than gating on partial data.

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays, 02:00 UTC
  workflow_dispatch:

jobs:
  bench:
    name: benchmark (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install strata and the competitor set (test-gated build)
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[dev,bench]"

      - name: Generate datasets
        run: make bench-data

      # A shared CI runner is noisy; the report records the environment, and
      # the gate below is what decides pass or fail.
      - name: Run the small tier
        run: make bench-small

      - name: Regression gate (>2% median or p95, >5% RSS)
        run: |
          PYTHONPATH=. python -m benchmarks.regression_check \
            docs/benchmarks/bench_results_small.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: docs/benchmarks/
