name: Benchmarks

# The cross-platform benchmark pipeline (docs/context/convention.md,
# "Platform supportability"): the same suite, datasets and fairness rules as
# the local run, on every supported platform/architecture leg — x86_64 Linux
# (SSE2/SWAR paths), x86_64 macOS, Windows/MSVC (the _umul128 Ryu path),
# arm64 macOS (the NEON paths on a machine that is not the development box),
# and — once the repo is public — arm64 Linux. The gate is the
# supportability tripwire: no ERROR rows, every category present, no row
# past the ratio bound. Absolute times are NEVER compared across machines —
# an earlier revision of this workflow gated CI runs against the committed
# same-machine baseline, which is meaningless off that machine; the tripwire
# replaced it. Headline standings come only from the documented
# quiet-machine protocol.
#
# Every leg benchmarks the PGO build — the build the release wheel ships and
# the headline protocol measures; competitors are their released wheels, so
# anything else undersells strata systematically (PGO is worth -8..-25% —
# docs/performance/SKILL.md). The POSIX legs run `make pgo` (clang/gcc
# two-phase profile + LTO); the Windows leg runs scripts/pgo_build_msvc.py
# (the LTCG twin: /GL, /GENPROFILE -> /USEPROFILE). Each report's
# compiler_flags line records exactly which build its leg measured.
#
# Reports and artifacts are named by platform-architecture, never by runner
# label: one `benchmark-<os>-<arch>` artifact per leg. `make bench-ci`
# (benchmarks/ci_fetch.py) pulls the latest run's reports into
# docs/benchmarks/ci/ and rebuilds docs/benchmarks/ci_summary.md — the
# per-platform standings that track the goal of strata #1 on every platform
# and architecture (docs/benchmarking/SKILL.md).
#
# The Windows steps invoke the benchmarks.* modules directly rather than
# Make targets (that runner has no make); the modules are the single
# implementation the Make targets forward to.

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays, 02:00 UTC
  workflow_dispatch:

jobs:
  bench:
    name: supportability (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # cc/cxx are explicit so the Linux leg gets clang (matching
          # llvm-profdata) and the macOS legs their system clang.
          - os: ubuntu-latest
            platform: linux-x86_64
            cc: clang
            cxx: clang++
          - os: macos-15-intel
            platform: macos-x86_64
            cc: cc
            cxx: c++
          - os: macos-latest
            platform: macos-arm64
            cc: cc
            cxx: c++

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # llvm-profdata must match the clang that writes the .profraw files;
      # macOS gets both from Xcode (the PGO script probes xcrun).
      - name: Install clang and LLVM
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake

      - name: Install strata with the dev and bench extras (test-gated build)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make install-bench

      - name: PGO+LTO build (gate tests on both phases)
        env:
          PYTHON: python
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make pgo

      - name: Generate the small-tier datasets
        run: |
          PYTHONPATH=. .venv/bin/python -m benchmarks.data.generate_bench_data \
            --out-dir benchmarks/data/generated/small \
            --num-users 1000 --max-orders 10 --max-items 5 --records 500

      # PGO_MODE/STRATA_ENABLE_LTO only inform the report's compiler_flags
      # line here — the installed extension is already the PGO+LTO build.
      - name: Run the benchmark suite
        env:
          PGO_MODE: use
          STRATA_ENABLE_LTO: "1"
        run: |
          PYTHONPATH=. .venv/bin/python -m benchmarks.bench_main \
            --name "ci-${{ matrix.platform }}" \
            --repeat 10 --warmup 2 \
            --dataset benchmarks/data/generated/small/users.json \
            --dataset benchmarks/data/generated/small/users.ndjson \
            --dataset benchmarks/data/generated/small/flat.json \
            --dataset benchmarks/data/generated/small/nested.json \
            --dataset benchmarks/data/generated/small/wide_arrays.json \
            --dataset benchmarks/data/generated/small/mixed.json \
            --output "bench_ci_${{ matrix.platform }}.md"

      - name: Supportability tripwire
        run: |
          PYTHONPATH=. .venv/bin/python -m benchmarks.supportability_check \
            "bench_ci_${{ matrix.platform }}.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.platform }}
          path: bench_ci_*.md
          if-no-files-found: ignore

  # NEON on Linux (mirrors ci.yml's test-linux-arm): GitHub's arm64 Linux
  # hosted runners serve public repositories only, so this leg skips cleanly
  # on private hosting and completes the platform matrix the moment the repo
  # goes public. Until then arm64 is benchmarked by the macos-arm64 leg.
  bench-linux-arm:
    name: supportability (linux-arm64)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake

      - name: Install strata with the dev and bench extras (test-gated build)
        env:
          CC: clang
          CXX: clang++
        run: make install-bench

      - name: PGO+LTO build (gate tests on both phases)
        env:
          PYTHON: python
          CC: clang
          CXX: clang++
        run: make pgo

      - name: Generate the small-tier datasets
        run: |
          PYTHONPATH=. .venv/bin/python -m benchmarks.data.generate_bench_data \
            --out-dir benchmarks/data/generated/small \
            --num-users 1000 --max-orders 10 --max-items 5 --records 500

      - name: Run the benchmark suite
        env:
          PGO_MODE: use
          STRATA_ENABLE_LTO: "1"
        run: |
          PYTHONPATH=. .venv/bin/python -m benchmarks.bench_main \
            --name "ci-linux-arm64" \
            --repeat 10 --warmup 2 \
            --dataset benchmarks/data/generated/small/users.json \
            --dataset benchmarks/data/generated/small/users.ndjson \
            --dataset benchmarks/data/generated/small/flat.json \
            --dataset benchmarks/data/generated/small/nested.json \
            --dataset benchmarks/data/generated/small/wide_arrays.json \
            --dataset benchmarks/data/generated/small/mixed.json \
            --output "bench_ci_linux-arm64.md"

      - name: Supportability tripwire
        run: |
          PYTHONPATH=. .venv/bin/python -m benchmarks.supportability_check \
            "bench_ci_linux-arm64.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-linux-arm64
          path: bench_ci_*.md
          if-no-files-found: ignore

  # MSVC PGO is spelled LTCG: scripts/pgo_build_msvc.py compiles /GL and
  # links /GENPROFILE -> /USEPROFILE around the same training workload the
  # POSIX `make pgo` uses, so this leg measures the same class of build the
  # others do — the report's compiler_flags line says so.
  bench-windows:
    name: supportability (windows-x86_64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install strata and the competitor set (test-gated build)
        shell: bash
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[dev,bench]"

      - name: PGO+LTCG build (gate tests on both phases)
        shell: bash
        run: python scripts/pgo_build_msvc.py

      - name: Generate the small-tier datasets
        shell: bash
        run: |
          PYTHONPATH=. python -m benchmarks.data.generate_bench_data \
            --out-dir benchmarks/data/generated/small \
            --num-users 1000 --max-orders 10 --max-items 5 --records 500

      # PGO_MODE/STRATA_ENABLE_LTO only inform the report's compiler_flags
      # line here — the installed extension is already the PGO+LTCG build.
      - name: Run the benchmark suite
        shell: bash
        env:
          PGO_MODE: use
          STRATA_ENABLE_LTO: "1"
        run: |
          PYTHONPATH=. python -m benchmarks.bench_main --name "ci-windows-x86_64" \
            --repeat 10 --warmup 2 \
            --dataset benchmarks/data/generated/small/users.json \
            --dataset benchmarks/data/generated/small/users.ndjson \
            --dataset benchmarks/data/generated/small/flat.json \
            --dataset benchmarks/data/generated/small/nested.json \
            --dataset benchmarks/data/generated/small/wide_arrays.json \
            --dataset benchmarks/data/generated/small/mixed.json \
            --output "bench_ci_windows-x86_64.md"

      - name: Supportability tripwire
        shell: bash
        run: |
          PYTHONPATH=. python -m benchmarks.supportability_check \
            "bench_ci_windows-x86_64.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-windows-x86_64
          path: bench_ci_*.md
          if-no-files-found: ignore
