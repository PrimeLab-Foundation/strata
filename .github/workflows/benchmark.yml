name: Benchmarks

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install -U pip setuptools wheel

      - name: Install Strata (test-gated build)
        run: python -m pip install -e .[dev,bench]

      - name: Run benchmarks
        run: |
          make bench-data
          python -m benchmarks.bench_main \
            --dataset benchmarks/data/generated/users.json \
            --dataset benchmarks/data/generated/users.ndjson \
            --repeat 1 --warmup 1 \
            --strict-missing off \
            --output docs/benchmarks/bench_results.md

      - name: Verify benchmark output has no ERROR rows
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("docs/benchmarks/bench_results.md").read_text()
          if "ERROR" in text:
              raise SystemExit("Benchmark output contains ERROR rows")
          print("Benchmark output OK")
          PY

      - name: Regression check (fail on >5% Strata regression)
        run: |
          python -m benchmarks.regression_check docs/benchmarks/bench_results.md --threshold 5

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: docs/benchmarks/bench_results.md
