name: A/B performance
run-name: "${{ inputs.experiment }} / ${{ inputs.validation || 'paired' }} / five platforms"

# Same-machine A-B-B-A of two revisions on all five platforms. The five-
# platform samples can only compare strata against its rivals within one
# run; two revisions land on two runners, and the Windows leg drew three
# processor models in three draws. This workflow builds BOTH revisions with
# the same PGO recipe on one runner, then alternates their extensions in one
# interpreter slot with orjson timed in the same process as the drift
# control (benchmarks/ab_rows.py -> rows_probe.py, the instrument P0 built
# and E26-P5/P5b used on the M1). An A/A run of the base revision against
# itself gives the floor, at the same block count as the comparison: the
# floor is a bootstrap over blocks, so a control with fewer blocks than the
# candidate is a weaker interval read as if it were the same one. On Linux it
# also records perf per arm and reads the serializer's frame sizes and
# stack-protector sites from the two binaries.
#
# Diagnostic artifacts never replace docs/benchmarks/. Canonical mode applies
# the same-machine regression gate to complete before/candidate reports.

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "revision A (branch, tag, or full 40-character SHA)"
        default: "75cfb422ede723193706740309d7509adf327f2b"
      cand_ref:
        description: "revision B (branch/tag/full SHA); empty uses workflow revision"
        default: ""
      experiment:
        description: "Optional isolated prototype (not accepted production code)"
        type: choice
        default: none
        options:
          - none
          - schema-recovery
          - file-newline
          - nested-mappings
          - nested-mappings-linux-arm64
          - float-digit-count
          - record-int-reserve
          - fused-tail-verification
          - combined
      blocks:
        description: "ABBA blocks (paired mode)"
        default: "6"
      validation:
        description: "Selected-row ABBA or full canonical small-tier regression gate"
        type: choice
        default: paired
        options:
          - paired
          - canonical
      repeat:
        description: "repeats per row per launch"
        default: "60"

jobs:
  ab:
    name: A/B (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # Two PGO builds, then 2 x (4 x blocks + 1) launches: the A/A run now
    # matches the comparison's block count instead of running two blocks.
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            cc: clang
            cxx: clang++
            archflags: ""
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            cc: clang
            cxx: clang++
            archflags: ""
          - os: macos-15-intel
            platform: macos-x86_64
            cc: cc
            cxx: c++
            archflags: "-arch x86_64"
          - os: macos-latest
            platform: macos-arm64
            cc: cc
            cxx: c++
            archflags: "-arch arm64"
    env:
      ARCHFLAGS: ${{ matrix.archflags }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      PYTHON: python
      EXPERIMENT: ${{ inputs.experiment }}
      BASE_REF: ${{ inputs.base_ref }}
      AB_BLOCKS: ${{ inputs.blocks }}
      AB_REPEAT: ${{ inputs.repeat }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.cand_ref || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang, LLVM and perf
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake linux-tools-common linux-tools-generic

      - name: CPU facts
        run: |
          mkdir -p ab
          { echo "platform ${{ matrix.platform }}"; uname -a; python -c "import platform; print(platform.processor(), platform.machine())"; \
            (grep -m1 'model name' /proc/cpuinfo || sysctl -n machdep.cpu.brand_string) 2>/dev/null; nproc 2>/dev/null || sysctl -n hw.ncpu; } | tee ab/cpu.txt

      - name: Apply the selected isolated experiment
        shell: bash
        run: |
          patches=()
          case "$EXPERIMENT" in
            none|"") ;;
            schema-recovery) patches=(experiments/benchmark-schema-recovery.patch) ;;
            file-newline) patches=(experiments/benchmark-file-newline.patch) ;;
            nested-mappings) patches=(experiments/benchmark-nested-mappings.patch) ;;
            nested-mappings-linux-arm64) patches=(experiments/benchmark-nested-mappings-linux-arm64.patch) ;;
            float-digit-count) patches=(experiments/benchmark-float-digit-count.patch) ;;
            record-int-reserve) patches=(experiments/benchmark-record-int-reserve.patch) ;;
            fused-tail-verification) patches=(experiments/benchmark-fused-tail-verification.patch) ;;
            combined) patches=(experiments/benchmark-schema-recovery.patch experiments/benchmark-file-newline.patch) ;;
            *) echo "Unknown experiment: $EXPERIMENT" >&2; exit 2 ;;
          esac
          mkdir -p ab
          echo "$EXPERIMENT" > ab/experiment.txt
          : > ab/patches.txt
          for patch in "${patches[@]}"; do echo "$patch" >> ab/patches.txt; done
          # Matched training: an isolated experiment compares one runtime
          # change under one test and training source, so the base must be
          # the candidate's own revision (E26-P7b: a test-suite difference
          # alone moves rows by several percent through the gate-inclusive
          # profile). Refuse anything else before an hour of building.
          base_commit=$(git rev-parse --verify "$BASE_REF^{commit}")
          if [ "${#patches[@]}" -gt 0 ] && [ "$base_commit" != "$(git rev-parse HEAD)" ]; then
            echo "experiment=$EXPERIMENT needs base_ref to name this checkout's revision: $base_commit != $(git rev-parse HEAD)" >&2
            exit 2
          fi
          if [ "${#patches[@]}" -gt 0 ]; then
            git apply --check "${patches[@]}"
            git apply "${patches[@]}"
            cp "${patches[@]}" ab/
            git ls-files --others --exclude-standard -- tests | while read -r added; do git add -N "$added"; done
          fi

      - name: Build B (candidate) with PGO+LTO, gate tests on both phases
        run: |
          make install-bench
          make pgo
          mkdir -p arms
          binary=$(.venv/bin/python -c 'import strata._strata as m; print(m.__file__)')
          cp "$binary" arms/B.so
          # A revision from before the provenance layer emits no sidecar
          # (docs/context/benchmarks.md: missing historical identities stay
          # unknown). Record that instead of failing the comparison.
          BIN="$binary"
          if [ -f "$binary.build.json" ]; then
            cp "$binary.build.json" arms/B.so.build.json
          else
            digest=$(sha256sum "$BIN" 2>/dev/null | cut -d' ' -f1 || shasum -a 256 "$BIN" | cut -d' ' -f1)
            printf '{"schema_version": 1, "unknown": "the candidate revision predates build identity", "extension_sha256": "%s", "complete_compilation": null, "source": {"commit": null}}\n' "$digest" > arms/B.so.build.json
          fi
          cp -R build/pgo ab/profile-B
          echo "B $(git rev-parse --short HEAD) $(md5sum arms/B.so 2>/dev/null || md5 -q arms/B.so)" | tee -a ab/arms.txt

      - name: Build A (base) with the same recipe in a worktree
        run: |
          git worktree add ../base "$BASE_REF"
          # Every selected patch's test hunks go to the base as well (a no-op
          # for a patch without any), so both PGO builds train on one suite
          # and only the runtime implementation differs between the arms.
          while read -r patch; do
            [ -n "$patch" ] || continue
            git -C ../base apply --include='tests/*' "$GITHUB_WORKSPACE/$patch"
          done < ab/patches.txt
          git -C ../base ls-files --others --exclude-standard -- tests | while read -r added; do git -C ../base add -N "$added"; done
          cd ../base
          make install-bench
          make pgo
          cd "$GITHUB_WORKSPACE"
          binary=$(../base/.venv/bin/python -c 'import strata._strata as m; print(m.__file__)')
          cp "$binary" arms/A.so
          # A revision from before the provenance layer emits no sidecar
          # (docs/context/benchmarks.md: missing historical identities stay
          # unknown). Record that instead of failing the comparison.
          BIN="$binary"
          if [ -f "$binary.build.json" ]; then
            cp "$binary.build.json" arms/A.so.build.json
          else
            digest=$(sha256sum "$BIN" 2>/dev/null | cut -d' ' -f1 || shasum -a 256 "$BIN" | cut -d' ' -f1)
            printf '{"schema_version": 1, "unknown": "the baseline revision predates build identity", "extension_sha256": "%s", "complete_compilation": null, "source": {"commit": null}}\n' "$digest" > arms/A.so.build.json
          fi
          cp -R ../base/build/pgo ab/profile-A
          echo "A $(git -C ../base rev-parse --short HEAD) $(md5sum arms/A.so 2>/dev/null || md5 -q arms/A.so)" | tee -a ab/arms.txt

      - name: Datasets (small and medium)
        run: |
          PYTHONPATH=. .venv/bin/python -m benchmarks.data.generate_bench_data \
            --out-dir benchmarks/data/generated/small --num-users 1000 --max-orders 10 --max-items 5 --records 500
          PYTHONPATH=. .venv/bin/python -m benchmarks.data.generate_bench_data \
            --out-dir benchmarks/data/generated/medium --num-users 2000 --max-orders 20 --max-items 10 --records 2000

      - name: A-B-B-A rounds, then an A/A floor
        if: inputs.validation != 'canonical'
        run: |
          TARGET="$(.venv/bin/python -c 'import strata._strata as m; print(m.__file__)')"
          # The file rows (load / ndload / dump) are real file operations, not
          # a subtraction of two in-memory medians; rows_probe.py mirrors
          # bench_main's rival compositions for each of them.
          ROWS="--row small:flat:dumps --row small:users:dumps --row small:mixed:dumps --row small:wide_arrays:dumps --row small:wide_arrays:loads --row small:users:loads --row small:mixed:loads --row small:wide_arrays:load --row small:users:ndload --row small:wide_arrays:dump --row small:mixed:dump --row small:flat:dump --row small:nested:dump --row medium:flat:dumps --row medium:users:dumps --row medium:mixed:dumps --row medium:wide_arrays:loads"
          PYTHONPATH=. .venv/bin/python benchmarks/ab_rows.py --build A=arms/A.so --build B=arms/B.so \
            --target "$TARGET" --out ab/R1.tsv $ROWS --blocks "$AB_BLOCKS" --repeat "$AB_REPEAT" 2> ab/R1.stderr
          # The same block count as the comparison: the floor is
          # max(|ci low|, |ci high|) of a bootstrap over blocks, and a
          # two-block control resamples two values -- ~51% coverage in
          # simulation against ~94% at six, which is not a floor a small
          # effect can be certified against (ab_blocks.MIN_CONTROL_BLOCKS,
          # which makes the tools say so when it is not met).
          PYTHONPATH=. .venv/bin/python benchmarks/ab_rows.py --build A=arms/A.so --build B=arms/A.so \
            --target "$TARGET" --out ab/AA.tsv $ROWS --blocks "$AB_BLOCKS" --repeat "$AB_REPEAT" 2> ab/AA.stderr
          for w in R1 AA; do
            PYTHONPATH=. .venv/bin/python benchmarks/ab_builds.py --analyze ab/$w.tsv > ab/${w}_analyze.txt
            PYTHONPATH=. .venv/bin/python benchmarks/ab_floor.py ab/$w.tsv > ab/${w}_floor.txt
          done
          # One estimator: R1's effect and interval printed beside the A/A
          # floor of the same statistic. ab_builds --analyze and ab_floor are
          # views over benchmarks/ab_blocks.py, so the three files agree by
          # construction.
          PYTHONPATH=. .venv/bin/python benchmarks/ab_blocks.py ab/R1.tsv --aa ab/AA.tsv \
            --json ab/R1_effect.json > ab/R1_blocks.txt
          PYTHONPATH=. .venv/bin/python benchmarks/ab_blocks.py ab/AA.tsv > ab/AA_blocks.txt
          echo "== R1 block-paired, normalised"; cat ab/R1_blocks.txt
          echo "== AA"; cat ab/AA_blocks.txt

      - name: Full canonical before/candidate reports and regression gate
        if: inputs.validation == 'canonical'
        run: |
          make probe-canonical-builds CANONICAL_BUILD_FLAGS="--before arms/A.so --candidate arms/B.so --output ab/canonical --tier small --repeat $AB_REPEAT"

      - name: Serializer symbols, frame sizes and stack-protector sites per arm
        if: matrix.platform != 'linux-arm64'
        shell: bash
        run: |
          for arm in A B; do
            if [ "$RUNNER_OS" = "Linux" ]; then
              nm -S --size-sort -C arms/$arm.so | grep -E 'Serializer|dumps' > ab/symbols.$arm.txt || true
              objdump -d -C --no-show-raw-insn arms/$arm.so | awk '
                /^[0-9a-f]+ <.*>:$/ { fn=$0; sub(/^[0-9a-f]+ </,"",fn); sub(/>:$/,"",fn); printed=0; chk=0; next }
                /sub[ \t]+\$0x[0-9a-f]+,%rsp/ && !printed { match($0,/\$0x[0-9a-f]+/); printf "%s frame %d\n", fn, strtonum(substr($0,RSTART+1,RLENGTH-1)); printed=1 }
                /__stack_chk_fail/ { printf "%s stack_chk\n", fn }
              ' | grep -E 'Serializer' | sort | uniq -c | sort -k2 > ab/frames.$arm.txt || true
            else
              nm -m arms/$arm.so | grep -E 'Serializer' | c++filt > ab/symbols.$arm.txt || true
              otool -tvV arms/$arm.so | awk '
                /^_.*:$/ { fn=$0; sub(/:$/,"",fn); printed=0; next }
                /subq[ \t]+\$0x[0-9a-f]+, %rsp/ && !printed { match($0,/\$0x[0-9a-f]+/); printf "%s frame %s\n", fn, substr($0,RSTART+1,RLENGTH-1); printed=1 }
                /___stack_chk_fail|___stack_chk_guard/ { printf "%s stack_chk\n", fn }
              ' | c++filt | grep -E 'Serializer' | sort | uniq -c | sort -k2 > ab/frames.$arm.txt || true
            fi
          done
          echo "== frames A"; cat ab/frames.A.txt; echo "== frames B"; cat ab/frames.B.txt

      # Hosted runners deny perf_event_open without CAP_PERFMON; try the sysctl
      # and let the step fail without failing the job (the A/B is what matters).
      - name: perf per arm on small dumps flat and users (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1 || echo perf)
          TARGET="$(.venv/bin/python -c 'import strata._strata as m; print(m.__file__)')"
          for arm in A B; do
            cp arms/$arm.so "$TARGET"
            for ds in flat users; do
              PYTHONPATH=. $PERF record -q -F 4999 -o ab/perf.$arm.$ds.data -- .venv/bin/python - <<PY
          import json, time, strata
          doc = json.load(open("benchmarks/data/generated/small/$ds.json"))
          end = time.perf_counter() + 4.0
          # return_type="bytes": the CI `dumps` row and rows_probe's
          # strata-bytes engine both measure the bytes call, and the public
          # default is text. Profiling the text call would attribute this row
          # to a different code path than the one it is behind on.
          while time.perf_counter() < end:
              strata.dumps(doc, return_type="bytes")
          PY
              $PERF report -i ab/perf.$arm.$ds.data --stdio --no-children --sort symbol 2>/dev/null | grep -v '^#' | grep -v '^$' | head -40 > ab/perf_report.$arm.$ds.txt || true
            done
          done
          cp arms/B.so "$TARGET"
          rm -f ab/perf.*.data
          for f in ab/perf_report.*.txt; do echo "== $f"; head -20 "$f"; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-${{ matrix.platform }}
          path: |
            ab/
            arms/
          if-no-files-found: warn

  ab-windows:
    name: A/B (windows-x86_64)
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      EXPERIMENT: ${{ inputs.experiment }}
      BASE_REF: ${{ inputs.base_ref }}
      AB_BLOCKS: ${{ inputs.blocks }}
      AB_REPEAT: ${{ inputs.repeat }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.cand_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply the selected isolated experiment
        shell: bash
        run: |
          patches=()
          case "$EXPERIMENT" in
            none|"") ;;
            schema-recovery) patches=(experiments/benchmark-schema-recovery.patch) ;;
            file-newline) patches=(experiments/benchmark-file-newline.patch) ;;
            nested-mappings) patches=(experiments/benchmark-nested-mappings.patch) ;;
            nested-mappings-linux-arm64) patches=(experiments/benchmark-nested-mappings-linux-arm64.patch) ;;
            float-digit-count) patches=(experiments/benchmark-float-digit-count.patch) ;;
            record-int-reserve) patches=(experiments/benchmark-record-int-reserve.patch) ;;
            fused-tail-verification) patches=(experiments/benchmark-fused-tail-verification.patch) ;;
            combined) patches=(experiments/benchmark-schema-recovery.patch experiments/benchmark-file-newline.patch) ;;
            *) echo "Unknown experiment: $EXPERIMENT" >&2; exit 2 ;;
          esac
          mkdir -p ab
          echo "$EXPERIMENT" > ab/experiment.txt
          : > ab/patches.txt
          for patch in "${patches[@]}"; do echo "$patch" >> ab/patches.txt; done
          # Matched training: an isolated experiment compares one runtime
          # change under one test and training source, so the base must be
          # the candidate's own revision (E26-P7b: a test-suite difference
          # alone moves rows by several percent through the gate-inclusive
          # profile). Refuse anything else before an hour of building.
          base_commit=$(git rev-parse --verify "$BASE_REF^{commit}")
          if [ "${#patches[@]}" -gt 0 ] && [ "$base_commit" != "$(git rev-parse HEAD)" ]; then
            echo "experiment=$EXPERIMENT needs base_ref to name this checkout's revision: $base_commit != $(git rev-parse HEAD)" >&2
            exit 2
          fi
          if [ "${#patches[@]}" -gt 0 ]; then
            git apply --check "${patches[@]}"
            git apply "${patches[@]}"
            cp "${patches[@]}" ab/
            git ls-files --others --exclude-standard -- tests | while read -r added; do git add -N "$added"; done
          fi

      - name: Build candidate with clang-cl PGO and full gates
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[dev,bench]"
          python scripts/pgo_build_clang_cl.py
          mkdir -p arms ab
          candidate_binary=$(python -c 'import strata._strata as m; print(m.__file__)')
          cp "$candidate_binary" arms/B.pyd
          # A revision from before the provenance layer emits no sidecar
          # (docs/context/benchmarks.md: missing historical identities stay
          # unknown). Record that instead of failing the comparison.
          BIN="$candidate_binary"
          if [ -f "$candidate_binary.build.json" ]; then
            cp "$candidate_binary.build.json" arms/B.pyd.build.json
          else
            digest=$(sha256sum "$BIN" 2>/dev/null | cut -d' ' -f1 || shasum -a 256 "$BIN" | cut -d' ' -f1)
            printf '{"schema_version": 1, "unknown": "the candidate revision predates build identity", "extension_sha256": "%s", "complete_compilation": null, "source": {"commit": null}}\n' "$digest" > arms/B.pyd.build.json
          fi
          cp -R build/pgo ab/profile-B
          python -m pip freeze --exclude-editable > ab/constraints.txt
          python -c "import platform; print(platform.platform(), platform.processor())" > ab/cpu.txt

      - name: Build baseline in its own environment
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          git worktree add ../base "$BASE_REF"
          # Every selected patch's test hunks go to the base as well (a no-op
          # for a patch without any), so both PGO builds train on one suite
          # and only the runtime implementation differs between the arms.
          while read -r patch; do
            [ -n "$patch" ] || continue
            git -C ../base apply --include='tests/*' "$GITHUB_WORKSPACE/$patch"
          done < ab/patches.txt
          git -C ../base ls-files --others --exclude-standard -- tests | while read -r added; do git -C ../base add -N "$added"; done
          constraints="$GITHUB_WORKSPACE/ab/constraints.txt"
          cd ../base
          python -m venv .venv
          .venv/Scripts/python -m pip install -U pip setuptools wheel
          .venv/Scripts/python -m pip install -c "$constraints" -e ".[dev,bench]"
          PATH="$(pwd)/.venv/Scripts:$PATH" .venv/Scripts/python scripts/pgo_build_clang_cl.py
          baseline_binary=$(.venv/Scripts/python -c 'import strata._strata as m; print(m.__file__)')
          cd "$GITHUB_WORKSPACE"
          cp "$baseline_binary" arms/A.pyd
          # A revision from before the provenance layer emits no sidecar
          # (docs/context/benchmarks.md: missing historical identities stay
          # unknown). Record that instead of failing the comparison.
          BIN="$baseline_binary"
          if [ -f "$baseline_binary.build.json" ]; then
            cp "$baseline_binary.build.json" arms/A.pyd.build.json
          else
            digest=$(sha256sum "$BIN" 2>/dev/null | cut -d' ' -f1 || shasum -a 256 "$BIN" | cut -d' ' -f1)
            printf '{"schema_version": 1, "unknown": "the baseline revision predates build identity", "extension_sha256": "%s", "complete_compilation": null, "source": {"commit": null}}\n' "$digest" > arms/A.pyd.build.json
          fi
          cp -R ../base/build/pgo ab/profile-A

      - name: Generate comparison datasets
        run: |
          PYTHONPATH=. python -m benchmarks.data.generate_bench_data --out-dir benchmarks/data/generated/small --num-users 1000 --max-orders 10 --max-items 5 --records 500
          PYTHONPATH=. python -m benchmarks.data.generate_bench_data --out-dir benchmarks/data/generated/medium --num-users 2000 --max-orders 20 --max-items 10 --records 2000

      - name: Serial ABBA and matching identical-binary control
        if: inputs.validation != 'canonical'
        run: |
          target_binary=$(python -c 'import strata._strata as m; print(m.__file__)')
          rows=(--row small:mixed:dumps --row small:flat:dumps --row small:users:dumps --row small:wide_arrays:dumps --row small:mixed:dump --row small:flat:dump --row small:nested:dump --row small:wide_arrays:loads --row medium:mixed:dumps --row medium:users:dumps)
          PYTHONPATH=. python benchmarks/ab_rows.py --build A=arms/A.pyd --build B=arms/B.pyd --target "$target_binary" --out ab/R1.tsv "${rows[@]}" --blocks "$AB_BLOCKS" --repeat "$AB_REPEAT" > ab/R1.txt 2> ab/R1.stderr
          PYTHONPATH=. python benchmarks/ab_rows.py --build A=arms/A.pyd --build B=arms/A.pyd --target "$target_binary" --out ab/AA.tsv "${rows[@]}" --blocks "$AB_BLOCKS" --repeat "$AB_REPEAT" > ab/AA.txt 2> ab/AA.stderr
          PYTHONPATH=. python benchmarks/ab_blocks.py ab/R1.tsv --aa ab/AA.tsv --json ab/comparison.json > ab/comparison.txt
          cat ab/comparison.txt

      - name: Full canonical before/candidate reports and regression gate
        if: inputs.validation == 'canonical'
        run: |
          PYTHONPATH=. python -m benchmarks.canonical_builds --before arms/A.pyd --candidate arms/B.pyd --output ab/canonical --tier small --repeat "$AB_REPEAT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-windows-x86_64
          path: |
            ab/
            arms/
          if-no-files-found: warn
