name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-22.04
            python: "3.11"
          - os: ubuntu-22.04
            python: "3.12"
          - os: ubuntu-22.04
            python: "3.13"
          - os: ubuntu-22.04
            python: "3.14"
          - os: macos-14
            python: "3.12"
          - os: macos-13
            python: "3.12"
          - os: windows-2022
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: python -m pip install -U pip setuptools wheel

      - name: Install Strata (test-gated build)
        run: python -m pip install -e .[dev]

      - name: Run Python tests (explicit)
        env:
          PYTHONPATH: python
        run: python -m pytest tests/py tests/unit -v
