name: CI

# The test-gated install is the gate: `pip install -e .` runs the C++ suite
# before compiling the extension and both Python suites after. The explicit
# ctest and pytest legs around it exist so a failure names which layer broke.
#
# SKIP_TESTS=1 is banned here, and setup.py refuses it outright when CI is set.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every supported Python on Linux ...
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          # ... plus both macOS architectures (macos-15-intel is x86_64,
          # macos-latest is arm64) and Windows, so the SIMD dispatch and the
          # MSVC branch of setup.py are both exercised. arm64 Linux is the
          # separate job below: its hosted runner exists for public repos
          # only, and a matrix leg with no matching runner queues forever.
          - os: macos-15-intel
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade packaging tools
        run: python -m pip install -U pip setuptools wheel

      - name: Run the C++ suite
        run: python scripts/cpp_tests.py

      - name: Install strata (test-gated build)
        run: python -m pip install -e ".[dev]"

      - name: Run the Python suites
        run: python scripts/py_tests.py

  # NEON on Linux (docs/context/convention.md § Platform supportability).
  # GitHub's `ubuntu-24.04-arm` hosted runners serve public repositories
  # only; on a private repository this job skips cleanly instead of queuing
  # until GitHub cancels it. While the repo is private, arm64 Linux is
  # covered by the macos-latest leg (same NEON paths, different OS) — making
  # this job real requires going public or attaching an arm64 larger runner.
  test-linux-arm:
    name: ubuntu-24.04-arm / py3.12
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade packaging tools
        run: python -m pip install -U pip setuptools wheel

      - name: Run the C++ suite
        run: python scripts/cpp_tests.py

      - name: Install strata (test-gated build)
        run: python -m pip install -e ".[dev]"

      - name: Run the Python suites
        run: python scripts/py_tests.py

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake

      - name: Install strata (test-gated build)
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[dev]"

      # Source-based coverage needs clang; the runner's default cc is gcc.
      - name: C++ coverage
        env:
          CC: clang
          CXX: clang++
        run: bash scripts/coverage.sh cpp

      - name: Python coverage
        run: bash scripts/coverage.sh py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/coverage/report/

  style:
    name: lint / format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install style tools
        run: python -m pip install -U 'ruff>=0.5' 'clang-format>=21,<22'

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: clang-format --dry-run --Werror
        run: |
          git ls-files -z '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' \
            ':!include/strata/third_party/**' \
            | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  corpus:
    name: fuzz corpus (ASan + UBSan)
    runs-on: ubuntu-latest
    # The C++ replay is minutes; the sanitized extension build below adds a
    # full rebuild of ~20 translation units plus two runs of both Python
    # suites under the sanitizer.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake

      # Hosted Ubuntu runners randomize mmap with 32 bits, more than ASan's
      # shadow layout tolerates ("shadow memory range interleaves with an
      # existing memory mapping"); 28 is the value the sanitizer expects.
      - name: Lower mmap randomization for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # The full fuzzing run is weekly (fuzz.yml). This leg replays the
      # committed corpus through the suites under the sanitizers on every
      # push, so a memory bug reaches the PR that introduced it.
      - name: Build and run the suites under ASan + UBSan
        env:
          CXX: clang++
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -g
        run: |
          cmake -B build/asan -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build build/asan --parallel
          ctest --test-dir build/asan --output-on-failure --no-tests=error

      # The step above compiles core_sources.txt only — src/strata/bindings is
      # not in it, so the raw stores into CPython-owned allocations have never
      # been sanitized anywhere. This one builds the extension itself with the
      # same sanitizers, into its own virtualenv, and runs both Python suites
      # against it (scripts/asan_py_tests.sh, docs/build-and-test/SKILL.md).
      - name: Build and run the Python suites under ASan + UBSan
        env:
          CC: clang
          CXX: clang++
        run: make test-py-asan

  # The same gate on the platform where it was validated (Apple clang, the
  # DYLD_INSERT_LIBRARIES preload): a Linux-only breakage in the corpus job's
  # copy cannot masquerade as a gate that never worked.
  bindings-asan-macos:
    name: bindings under ASan + UBSan (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and run the Python suites under ASan + UBSan
        run: make test-py-asan
