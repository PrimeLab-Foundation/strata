name: PGO

# Two-phase PGO + LTO build. `make pgo` runs the full gate on *both* the
# instrumented and the optimized build — an optimized extension that fails its
# tests is worth nothing, and PGO is exactly the kind of change that can
# miscompile silently.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC
  workflow_dispatch:

jobs:
  pgo:
    name: PGO + LTO (ubuntu / clang)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # llvm-profdata must match the clang that wrote the .profraw files.
      - name: Install clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake

      # pgo_build.sh drives everything through .venv and its gate needs the
      # dev and bench extras (pytest, cmake, the competitor set for the
      # verification benchmarks) — the scheduled run failed without them.
      - name: Install strata with dev and bench extras (test-gated build)
        env:
          CC: clang
          CXX: clang++
        run: make install-bench

      - name: Run the PGO workflow
        env:
          PYTHON: python
          CC: clang
          CXX: clang++
        run: make pgo

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgo-benchmark-results
          path: build/pgo/bench_results_pgo.md
          if-no-files-found: ignore
