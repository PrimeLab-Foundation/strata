repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies: []
        args: ["--config-file", "mypy.ini"]
        files: ^src/turbojsonpath/.*\.py$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        files: ".*\\.py$"
        exclude: |
          ^docs/|
          ^benchmarks/artifacts/|
          ^BENCH_RESULTS\.md$
      - id: trailing-whitespace
        files: ".*\\.py$"
        exclude: |
          ^docs/|
          ^benchmarks/artifacts/|
          ^BENCH_RESULTS\.md$
      - id: mixed-line-ending
        args: ["--fix=lf"]
        files: ".*\\.py$"
        exclude: |
          ^docs/|
          ^benchmarks/artifacts/|
          ^BENCH_RESULTS\.md$
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.5
    hooks:
      - id: clang-format
        files: \.(cpp|hpp|cc|hh|cxx|h)$
        # Temporarily exclude C/C++ sources from automatic reformatting in pre-commit
        # to avoid noisy diffs during documentation-only edits. Use `make fmt` on demand.
        exclude: |
          ^cpp/|
          ^include/|
          ^src/
  - repo: https://github.com/executablebooks/mdformat
    # Pin to a version compatible with mdformat-gfm/frontmatter plugins
    rev: 0.7.17
    hooks:
      - id: mdformat
        additional_dependencies:
          # Pin plugin versions to avoid resolver backtracking conflicts
          - mdformat-gfm==0.3.7
          - mdformat-frontmatter==0.4.1
        files: ".*\\.md$"
        exclude: |
          ^docs/|
          ^benchmarks/artifacts/|
          ^BENCH_RESULTS\.md$
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.19.0    # pick a real tag you want
    hooks:
      - id: markdownlint-cli2
        files: ".*\\.md$"
